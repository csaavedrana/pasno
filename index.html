<style>
/* Layout: one-column phone app — header, scrolling screen, fixed bottom nav with a central "Vender" button */
:root{
  --bg:#F5F3F7; --surface:#FFFFFF; --ink:#1F1A26; --muted:#6E6679; --line:#E4DFEA;
  --plum:#4B2E5C; --plum-soft:#EFE7F4; --amber:#B9781B; --amber-soft:#FBF0DD;
  --good:#2F7D4F; --good-soft:#E3F2E8; --warn:#B4531C; --warn-soft:#FBE9DD;
  --display:"Marcellus", Georgia, "Times New Roman", serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17131C; --surface:#221C29; --ink:#F1ECF5; --muted:#A79DB2; --line:#352D3E;
  --plum:#C9A7DD; --plum-soft:#33273D; --amber:#E2A84E; --amber-soft:#3A2D1A;
  --good:#6CC791; --good-soft:#1E3327; --warn:#F09A62; --warn-soft:#3B2519; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131C; --surface:#221C29; --ink:#F1ECF5; --muted:#A79DB2; --line:#352D3E;
  --plum:#C9A7DD; --plum-soft:#33273D; --amber:#E2A84E; --amber-soft:#3A2D1A;
  --good:#6CC791; --good-soft:#1E3327; --warn:#F09A62; --warn-soft:#3B2519; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top, 0px)) 130px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 4px}
.brand{font-family:var(--display);font-size:30px;letter-spacing:.04em;color:var(--plum);margin:0}
.brand small{font-family:var(--body);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--plum);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;padding:0}
.iconbtn svg{width:22px;height:22px}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:24px 0 10px;text-wrap:balance}
h3{font-size:15px;margin:18px 0 8px}
.lab{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero{background:var(--plum);color:var(--bg);border-radius:var(--r);padding:18px;display:grid;gap:4px;margin-top:10px}
.hero .lab{color:inherit;opacity:.8}
.hero .big{font-family:var(--display);line-height:1.1;font-size:clamp(24px,7vw,34px)}
.hero .sub{font-size:13px;opacity:.85}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hcol{display:grid;gap:4px;align-content:start;min-width:0}
.hnet{border-left:1px solid color-mix(in srgb, var(--bg) 35%, transparent);padding-left:16px}
@media (max-width:360px){.hgrid{grid-template-columns:1fr}.hnet{border-left:0;padding-left:0;border-top:1px solid color-mix(in srgb, var(--bg) 35%, transparent);padding-top:12px}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:2px;min-width:0;text-align:left;color:var(--ink)}
button.tile{font:inherit;cursor:pointer}
.tile .v{font-size:21px;font-weight:700}
.tile .n{font-size:12.5px;color:var(--muted)}
.tile.alert .v{color:var(--warn)}
.pockets{display:grid;gap:8px}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:700;text-align:right;white-space:nowrap}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rowbtn{all:unset;display:flex;width:100%;box-sizing:border-box;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:56px}
.rowbtn:first-child{border-top:0}
.rowbtn .main{flex:1;min-width:0;text-align:left}
input[type=checkbox],input[type=radio]{accent-color:var(--plum)}
.rowbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;vertical-align:1px}
.chip.d{background:var(--plum-soft);color:var(--plum)}
.chip.n{background:var(--amber-soft);color:var(--amber)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--plum);color:var(--bg);text-align:center;text-decoration:none;display:inline-block;min-height:44px}
.btn.ghost{background:var(--plum-soft);color:var(--plum)}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:10px;min-height:38px}
.btn.paid{background:var(--good);color:var(--bg)}
.btn.wa{background:var(--good-soft);color:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--bg)}
.seg.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.seg.scroll button{flex:none}
form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label,.flab{font-size:13px;font-weight:600}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none;min-height:46px}
textarea{min-height:90px;resize:vertical;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:52px}
.pick:first-child{border-top:0}
.pick input{width:22px;height:22px;flex:none}
.pick .main{flex:1;min-width:0}
.pick.on{background:var(--plum-soft)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--plum);font-weight:700}
.step b{min-width:18px;text-align:center}
.sched{background:var(--amber-soft);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;font-size:14px}
.sched .r{display:flex;justify-content:space-between;gap:10px}
.sched .r b,.sched .r>span:last-child{white-space:nowrap}
.sched .r.tot{border-top:1px solid color-mix(in srgb, var(--amber) 35%, transparent);padding-top:6px;margin-top:4px;font-weight:700}
.box{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:10px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}
.okbox{background:var(--good-soft);color:var(--good);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}
.cuota{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px dashed var(--line)}
.cuota .main{flex:1;min-width:0}
.sub{padding:10px 14px;border-top:1px dashed var(--line);display:grid;gap:8px}
.client{border-top:1px solid var(--line)}
.client:first-child{border-top:0}
.client details summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:56px}
.client details summary::-webkit-details-marker{display:none}
.client details[open] summary{background:var(--plum-soft)}
.radio{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.radio input{width:20px;height:20px;flex:none;margin-top:1px}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.msgprev{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--amber)}
.prog.over span{background:var(--warn)}
.banner{display:flex;align-items:center;gap:12px;background:var(--amber-soft);border-radius:var(--r);padding:12px 14px;margin-top:8px}
.banner .main{flex:1;min-width:0;font-size:13.5px}
.banner b{display:block;color:var(--amber)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom, 0px));z-index:5}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;padding:4px 0;min-height:48px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--plum)}
nav.tabs .sell{background:var(--amber);color:#fff;border-radius:16px;padding:10px 0;margin:0 6px;transform:translateY(-8px);box-shadow:0 4px 14px rgba(0,0,0,.18)}
nav.tabs .sell[aria-current="page"]{color:#fff}
nav.tabs .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--warn);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px;line-height:1.3}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:9;width:max-content;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast button{border:0;background:var(--amber);color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.sheet{position:fixed;inset:0;background:rgba(20,14,26,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom, 0px));display:grid;gap:14px}
.sheet h2{margin:0}
.steps{display:grid;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:center;font-size:15px}
.steps li:before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--plum);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.steps svg{width:20px;height:20px;vertical-align:-4px;color:#2F7BF6}
.search{margin-bottom:8px}
@media (prefers-reduced-motion: no-preference){.screen{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
.topicons{display:flex;gap:8px}
.topbar{display:flex;align-items:center;gap:10px;margin:8px 0 4px}
.topbar h2{margin:0;flex:1}
.back{border:1px solid var(--line);background:var(--surface);color:var(--plum);border-radius:12px;min-width:44px;height:44px;padding:0 12px;font-weight:700;display:grid;place-items:center}
.stepper-dots{display:flex;gap:6px;margin:4px 0 12px}
.stepper-dots span{height:4px;flex:1;border-radius:4px;background:var(--line)}
.stepper-dots span.on{background:var(--plum)}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));z-index:6}
.actionbar .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.actionbar .btn{flex:1}
.actionbar .btn.ghost{flex:0 0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.addrow{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;min-height:60px}
.addrow:first-of-type{border-top:0}
.addrow .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--plum-soft);color:var(--plum);flex:none}
.addrow .ic.am{background:var(--amber-soft);color:var(--amber)}
.addrow .ic.gr{background:var(--good-soft);color:var(--good)}
.addrow .ic svg{width:22px;height:22px}
.addrow .t{font-size:16px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .btn{width:100%}
.sheet .panel{max-height:88vh;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:-8px auto 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chosen{display:flex;flex-wrap:wrap;gap:6px}
.chosen button{border:0;background:var(--plum-soft);color:var(--plum);border-radius:999px;padding:6px 10px;font-weight:600;font-size:13px}
.linkbtn{border:0;background:none;color:var(--plum);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.pend{display:grid;gap:8px}
.pend .rowbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pend .rowbtn:first-child{border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--amber)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini .tile{padding:10px}
.mini .tile .v{font-size:16px}
.line{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.line:first-child{border-top:0}
.line .main{flex:1;min-width:0}
.x{border:0;background:var(--bg);color:var(--muted);width:32px;height:32px;border-radius:8px;font-weight:700}
.apply{font-size:13px;display:grid;gap:3px}
.apply .r{display:flex;justify-content:space-between;gap:8px}
:root{--c-cash:var(--good);--c-owed:var(--amber);--c-stock:var(--plum)}
.topbar h2,.sheet h2{min-width:0;overflow-wrap:anywhere}
</style></head><body>

<div class="wrap">
  <header class="top">
    <p class="brand">Pasnó<small>Perfumería</small></p>
    <div class="topicons">
      <button class="iconbtn" data-a="clientes" data-f="todos" aria-label="Clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14c2 .7 3 2.8 3 6"/></svg></button>
      <button class="iconbtn" data-a="go" data-to="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    </div>
  </header>
  <main id="app"></main>
</div>
<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-a="go" data-to="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-a="go" data-to="cobrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Cobrar<span id="badge" class="badge" hidden></span></button>
    <button data-a="plus" class="sell" aria-label="Anotar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Anotar</button>
    <button data-a="go" data-to="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6v3H9zM8 6h8l1 4v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-9z"/></svg>Stock</button>
    <button data-a="go" data-to="plata"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1z"/><path d="M4 7l11-3v3M16 13.5h.01"/></svg>Plata</button>
  </div>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<script>

const SEED = null;
const KEY = 'pasno-cache-v5';
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
// Feriados de Chile (los que caen en días hábiles importan para el 5° día hábil)
const HOL = new Set(['2026-01-01','2026-04-03','2026-04-04','2026-05-01','2026-05-21','2026-06-21','2026-06-29','2026-07-16','2026-08-15','2026-09-18','2026-09-19','2026-10-12','2026-10-31','2026-11-01','2026-12-08','2026-12-25','2027-01-01','2027-03-26','2027-03-27','2027-05-01','2027-05-21','2027-06-21','2027-06-28','2027-07-16','2027-08-15','2027-09-17','2027-09-18','2027-09-19','2027-10-11','2027-10-31','2027-11-01','2027-12-08','2027-12-25']);
const TPL = {
  antes: 'Hola {nombre}! Te recuerdo que el {fecha} vence la cuota {cuota} de tu perfume, por {monto}. Puedes transferir a la cuenta de siempre con tu nombre en el comentario. ¡Gracias! (Si ya pagaste, ignora este mensaje)',
  hoy: 'Hola {nombre}! Hoy vence la cuota {cuota} de tu perfume, por {monto}. Puedes transferir a la cuenta de siempre con tu nombre en el comentario. ¡Gracias! (Si ya pagaste, ignora este mensaje)',
  atrasada: 'Hola {nombre}! Te escribo por tu perfume: tienes {total} pendiente (cuota {cuota}, venció el {fecha}). ¿Me confirmas cuándo puedes transferir? ¡Gracias! (Si ya pagaste, ignora este mensaje)'
};

/* ---------- helpers ---------- */
const clp = n => (n<0?'-':'') + '$' + Math.abs(Math.round(n||0)).toLocaleString('es-CL');
const num = v => +String(v??'').replace(/[^\d]/g,'') || 0;
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const iso = d => d.toISOString().slice(0,10);
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const D = s => { const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const addDays = (s,k) => { const d=D(s); d.setUTCDate(d.getUTCDate()+k); return iso(d); };
const daysBetween = (a,b) => Math.round((D(b)-D(a))/864e5);

const fmtDate = s => { if(!s) return 'sin fecha'; const [y,m,d]=s.split('-'); return `${+d} ${MESES[+m-1]}${y!==today().slice(0,4)?' '+y.slice(2):''}`; };
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const fmtDay = s => s ? `${DIAS[D(s).getUTCDay()]} ${fmtDate(s)}` : 'sin fecha';
const isBiz = s => { const w=D(s).getUTCDay(); return w!==0 && w!==6 && !HOL.has(s); };
const nextBiz = s => { while(!isBiz(s)) s=addDays(s,1); return s; };
function fifthBiz(y,m){ let s=iso(new Date(Date.UTC(y,m,1))), c=0; for(;;){ if(isBiz(s) && ++c===5) return s; s=addDays(s,1); } }
function dueIn(y,m,dia){ if(!dia) return fifthBiz(y,m); const d=new Date(Date.UTC(y,m,1)); const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate(); return nextBiz(iso(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),Math.min(dia,last))))); }
function schedule(fecha,n,dia){ const d=D(fecha), out=[]; for(let i=1;i<=n;i++) out.push(dueIn(d.getUTCFullYear(), d.getUTCMonth()+i, dia)); return out; }
const nextMonthDue = (dia) => schedule(today(),1,dia)[0];
function split(total,n){ const base=total>=n*100?Math.floor(total/n/100)*100:Math.floor(total/n); return Array.from({length:n},(_,i)=> i===n-1 ? total-base*(n-1) : base); }

  return out.sort((a,b)=>(a.c.vence||'9').localeCompare(b.c.vence||'9')||a.c.n-b.c.n); }
function byClient(list){ const m=new Map(), t=today();
  for(const o of list){ if(!m.has(o.k.id)) m.set(o.k.id,{k:o.k,items:[],total:0,venc:0,vencN:0,next:null});
    const g=m.get(o.k.id); g.items.push(o); g.total+=o.saldo; if(!o.c.conf && o.c.vence && o.c.vence<t){ g.venc+=o.saldo; g.vencN++; } if(!o.c.conf && (!g.next || o.c.vence<g.next)) g.next=o.c.vence; }
  return [...m.values()].sort((a,b)=>b.vencN-a.vencN || (a.next||'9').localeCompare(b.next||'9') || b.total-a.total); }

/* decants: la botella abierta se lleva en "decants de 5 ml" (un 10 ml cuenta como 2) */
function decStats(b){ let u5=0,u10=0,ingreso=0,costo=0,f5=0,f10=0;
  for(const v of S.ventas) for(const i of v.items) if(i.t==='d'&&i.ref===b.id){ if(i.size===10) u10++; else u5++; ingreso+=i.precio; costo+=i.costo; }
  for(const g of (S.consignas||[])) for(const i of g.items) if(i.t==='d'&&i.ref===b.id&&i.estado==='fuera'){ if(i.size===10) f10++; else f5++; costo+=i.costo; }
  const usados=u5+u10*2+f5+f10*2, est=b.dec?b.dec.est:0;
  return {u5,u10,f5,f10,usados,quedan:Math.max(0,est-usados),ingreso,costo,resto:Math.max(0,b.cost-costo)}; }
// costo de un decant: parte proporcional de la botella, sin pasarse de lo que queda por cubrir
const decCost = (b,u,yaCargado=decStats(b).costo) => Math.min(Math.round(u*b.cost/Math.max(1,b.dec.est)), Math.max(0,b.cost-yaCargado));

function calc(){
  const t=today(), m=t.slice(0,7), {paid}=idx();
  let porCobrar=0, vencido=0, porConf=0, incobrable=0;
  const paidRaw=c=>paid.get(c.id)||0;
  for(const c of S.cuotas){ if(c.perdida){ incobrable+=Math.max(0,c.monto-paidRaw(c)); continue; } const s=saldoC(c,paid); if(!s) continue; if(c.conf){ porConf+=s; continue; } porCobrar+=s; if(c.vence && c.vence<t) vencido+=s; }
  let ventas=0, costo=0, ventasMes=0, ganMes=0;
  for(const v of S.ventas) for(const i of v.items){ ventas+=i.precio; costo+=i.costo; if(v.fecha && v.fecha.slice(0,7)===m){ ventasMes+=i.precio; ganMes+=i.precio-i.costo; } }
  const sumB = f => S.bottles.filter(f).reduce((a,b)=>a+b.cost,0), cntB = e => S.bottles.filter(b=>b.estado===e).length;
  const stockB=sumB(b=>b.estado==='Stock'), camino=sumB(b=>b.estado==='En camino'), revisar=sumB(b=>b.estado==='Revisar');
  const abiertas=S.bottles.filter(b=>b.estado==='Abierta'), abiertasVal=abiertas.reduce((a,b)=>a+decStats(b).resto,0);
  const agotadas=S.bottles.filter(b=>b.estado==='Agotada');
  const ajusteDec=agotadas.reduce((a,b)=>a+(b.dec.ajuste||0),0), ajusteDecMes=agotadas.filter(b=>(b.dec.cerrada||'').slice(0,7)===m).reduce((a,b)=>a+(b.dec.ajuste||0),0);
  const regalos=sumB(b=>b.estado==='Regalo'), perdidas=sumB(b=>b.estado==='Pérdida'), comis=sumB(b=>b.estado==='Comisión'), comisMes=sumB(b=>b.estado==='Comisión'&&(b.fSalida||'').slice(0,7)===m);
  const regalosMes=sumB(b=>b.estado==='Regalo' && (b.fSalida||'').slice(0,7)===m), perdidasMes=sumB(b=>b.estado==='Pérdida'&&(b.fSalida||'').slice(0,7)===m);
  const gastos=S.gastos.reduce((a,g)=>a+g.monto,0), gastosMes=S.gastos.filter(g=>(g.fecha||'').slice(0,7)===m).reduce((a,g)=>a+g.monto,0);
  const bruta=ventas-costo, neta=bruta-regalos-perdidas-comis-gastos-ajusteDec-incobrable, netaMes=ganMes-gastosMes-regalosMes-perdidasMes-comisMes-ajusteDecMes;
  const pend=S.deudas.filter(d=>!d.pagado).sort((a,b)=>a.vence.localeCompare(b.vence));
  const deuda=pend.reduce((a,d)=>a+d.monto,0);
  const aportes=(S.cfg.capital||0)+S.movs.filter(x=>x.tipo==='Aporte de capital').reduce((a,x)=>a+x.monto,0);
  const retiros=S.movs.filter(x=>x.tipo==='Retiro personal'||x.tipo==='Uso propio').reduce((a,x)=>a+x.monto,0);
  const cobradoMes=S.pagos.filter(p=>(p.fecha||'').slice(0,7)===m&&p.tipo!=='favor').reduce((a,p)=>a+p.monto,0);
  const favor=S.clientes.reduce((a,k)=>a+(k.favor||0),0);
  const K=S.saldos[S.saldos.length-1]||null, caja=K?(K.banco||0)+(K.ahorro||0)+(K.efectivo||0):0;
  const consigItems=(S.consignas||[]).flatMap(g=>g.items.filter(i=>i.estado==='fuera')), consigVal=consigItems.reduce((a,i)=>a+i.costo,0), consigPrecio=consigItems.reduce((a,i)=>a+i.precio,0);
  const stock=stockB+camino+abiertasVal+consigVal;
  const segunPlata = caja + stock + revisar + porCobrar + porConf - deuda - favor - aportes + retiros;
  return {consigVal,consigPrecio,nConsig:consigItems.length,porCobrar,vencido,porConf,incobrable,ventas,costo,bruta,neta,netaMes,margen:ventas?bruta/ventas:0,ventasMes,ganMes,gastosMes,stockB,camino,revisar,abiertasVal,stock,
    nStock:cntB('Stock'),nCamino:cntB('En camino'),nRevisar:cntB('Revisar'),nAbiertas:abiertas.length,nPorEntregar:S.bottles.filter(b=>b.porEntregar).length,
    regalos,perdidas,regalosMes,gastos,deuda,proxDeuda:pend[0]||null,aportes,retiros,cobradoMes,favor,K,caja,segunPlata};
}

// posibles duplicados: mismo nombre "base" (sin tía/profe/pie/clam…) o a una letra de distancia
const STOP=new Set(['tia','tio','profe','miss','sra','senora','clam','pie','colo','colocolo','wanda','de','la','el','los','las','y','mama','papa','hijo','hija','hmno','amiga','amigo','chico','apoderado','asistente','2do','por','revisar','sin','nombre']);
const tokens = n => norm(n).replace(/[^a-z0-9 ]/g,' ').replace(/k/g,'c').replace(/z/g,'s').replace(/y/g,'i').replace(/h/g,'').split(/\s+/).filter(w=>w.length>=3&&!STOP.has(w));
function lev(a,b){ if(Math.abs(a.length-b.length)>1) return 2; const m=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p=m[0]; m[0]=i; for(let j=1;j<=b.length;j++){ const t=m[j]; m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return m[b.length]; }
// todas las palabras del nombre más corto coinciden (al menos una exacta); "papá de…", "hijo de…" son otra persona
const REL=/\b(papa|mama|hijo|hija|hmno|hermano|hermana|amiga|amigo|chico|apoderado)\b/;
function similar(a,b){ const ra=(norm(a.nombre).match(REL)||[''])[0], rb=(norm(b.nombre).match(REL)||[''])[0]; if(ra!==rb) return false;
  const A=tokens(a.nombre), B=tokens(b.nombre); if(!A.length||!B.length) return false; const [s,l]=A.length<=B.length?[A,B]:[B,A];
  let exact=false; const ok=s.every(x=>l.some(y=>{ if(x===y){ exact=true; return true; } return x.length>=4&&y.length>=4&&x[0]===y[0]&&lev(x,y)<=1; })); return ok&&exact; }
function dupsOf(k){ return S.clientes.filter(o=>o!==k&&!o.nombre.startsWith('Sin nombre')&&similar(k,o)); }
function dupPairs(){ let n=0; const cs=S.clientes.filter(c=>!c.nombre.startsWith('Sin nombre')); for(let i=0;i<cs.length;i++) for(let j=i+1;j<cs.length;j++) if(similar(cs[i],cs[j])) n++; return n; }

function simulate(kid,amt){ const {paid}=idx(); const out=[]; let rest=amt, partial=null;

  return {out,partial,extra:rest}; }

}
function bottleRow(b){ const age=b.fCompra&&b.estado==='Stock'?daysBetween(b.fCompra,today()):null;
  const late=(b.estado==='En camino'||(b.porEntregar&&!b.llego))&&daysBetween(b.fEspera||addDays(b.fCompra||today(),15),today())>0;
  const tag=b.porEntregar?`<span class="chip n">vendido a ${esc(saludo(cliName((S.ventas.find(v=>v.id===b.venta)||{}).cliente)))}, ${b.llego?'llegó, falta entregar':'por entregar'}</span>`:b.estado==='En camino'?`<span class="chip n">en camino${b.fCompra?' hace '+daysBetween(b.fCompra,today())+' d':''}</span>`:'';
  return `<button class="rowbtn" data-a="bottle" data-id="${b.id}"><div class="main"><div class="t">${esc(b.name)}</div><div class="s">${b.ml} ml · costo ${clp(b.cost)}${age!=null?` · ${age} día${age===1?'':'s'}`:''} ${age>60?'<span class="chip w">lento</span>':''} ${tag} ${late?'<span class="chip w">atrasado</span>':''}</div></div><span class="chip ${b.tipo==='Diseñador'?'d':'n'}">${b.tipo}</span><span class="amt">${b.price?clp(b.price):''}</span></button>`; }
function abiertaRow(b){ const s=decStats(b), pct=Math.min(100,s.ingreso/Math.max(1,b.cost)*100);
  return `<button class="rowbtn" data-a="bottle" data-id="${b.id}" style="display:block"><div style="display:flex;gap:10px;align-items:center"><div class="main"><div class="t">${esc(b.name)}</div><div class="s">${s.u5} de 5 ml · ${s.u10} de 10 ml · quedan ~${s.quedan} de 5 ml</div></div><span class="amt" style="font-size:13px">${clp(b.dec.p5)} / ${b.dec.p10?clp(b.dec.p10):'—'}</span></div>
    <div class="prog" style="margin-top:8px"><span style="width:${pct}%;background:${s.ingreso>=b.cost?'var(--good)':'var(--amber)'}"></span></div><div class="s" style="margin-top:4px">Recuperaste ${clp(s.ingreso)} de ${clp(b.cost)}${s.ingreso>=b.cost?' ✓':''}</div></button>`; }
function vMiStock(k){
  const q=norm(V('stq')), f=ui.stockF, match=b=>!q||norm(b.name).includes(q);
  const sets={'Todo':S.bottles.filter(b=>b.estado==='Stock'),'Abiertas':S.bottles.filter(b=>b.estado==='Abierta'),'En camino':S.bottles.filter(b=>b.estado==='En camino'),'Por entregar':S.bottles.filter(b=>b.porEntregar)};

  const chips=[['Todo',k.nStock],['Abiertas',k.nAbiertas],['En camino',k.nCamino]].concat(k.nPorEntregar?[['Por entregar',k.nPorEntregar]]:[]);
  return `<p class="note">${clp(k.stock)} invertidos · ${k.nStock} botellas${k.nAbiertas?' · '+k.nAbiertas+' abiertas para decants':''}${k.nCamino?' · '+k.nCamino+' en camino':''}</p>
  <div class="chips" style="margin-top:10px">${chips.map(([x,n])=>`<div class="seg"><button data-a="stockF" data-v="${x}" ${pressed(f===x)}>${x} (${n})</button></div>`).join('')}</div>

  <p class="note">${f==='Abiertas'?'Cada botella abierta lleva la cuenta de los decants que vendes. Un 10 ml cuenta como 2 de 5 ml.':'Toca una botella para venderla, abrirla para decants, regalarla o darla de baja. Para agregar perfumes usa el botón +.'}</p>`;
}

/* ---------- Vender ---------- */
function chosenItems(){ const out=[];
  for(const [key,qty] of Object.entries(picks)){
    if(key.includes('|')){ const [id,sz]=key.split('|'), b=S.bottles.find(x=>x.id===id); if(!b||!b.dec) continue; const size=+sz;
      out.push({key,ref:id,dec:true,size,u:size===10?2:1,nombre:`${b.name} · ${size} ml`,lista:size===10?b.dec.p10:b.dec.p5,qty}); continue; }
    const b=S.bottles.find(x=>x.id===key); if(b) out.push({key,ref:key,nombre:b.name,lista:b.price,costo:b.cost,qty:1,camino:b.estado==='En camino'}); }

function vCierre(){
  const k=calc(), st=ui.cStep, K=k.K, needCap=S.cfg.capital==null, steps=needCap?6:5;
  const head=`${topbar('Cierre de mes','cancel','✕')}${stepDots(st,steps)}`;
  const q=(id,label,ph,next,prev)=>head+`<div class="field"><label for="${id}" style="font-size:18px;font-family:var(--display);font-weight:400">${label}</label><input id="${id}" data-k data-r inputmode="numeric" placeholder="${ph}" value="${esc(V(id))}"></div>`+actionbar(`${prev?`<button class="btn ghost" data-a="cStep" data-v="${prev}">Atrás</button>`:''}<button class="btn" data-a="cStep" data-v="${next}" ${V(id)!==''?'':'disabled'}>Siguiente</button>`);
  if(st===1) return q('kb','¿Cuánto hay hoy en la cuenta de los perfumes?',K?'La vez pasada: '+K.banco.toLocaleString('es-CL'):'',2,0);
  if(st===2) return q('ka','¿Y en el ahorro (Copeuch)?',K?'La vez pasada: '+K.ahorro.toLocaleString('es-CL'):'',3,1);
  if(st===3){ const desde=K?K.fecha:'0', ef=S.pagos.filter(p=>p.medio==='Efectivo'&&(p.fecha||'')>=desde).reduce((a,p)=>a+p.monto,0), dep=S.movs.filter(m=>m.tipo==='Depósito efectivo'&&(m.fecha||'')>=desde).reduce((a,m)=>a+m.monto,0);
    return q('ke','¿Cuánto hay en la caja de efectivo?',K&&K.efectivo?'La vez pasada: '+K.efectivo.toLocaleString('es-CL'):'0 si no hay',4,2).replace('</div><div class="actionbar"',`<span class="s">Cuenta la caja chica y lo que tengan Mati y Wanda del negocio.${ef?` Desde el último cierre recibiste ${clp(ef)} en efectivo${dep?` y depositaste ${clp(dep)}`:''}.`:''}</span></div><div class="actionbar"`); }
  if(st===4 && needCap) return q('kc','¿Cuánta plata tuya pusiste al partir?','Solo se pregunta una vez',5,3);
  if(st===steps-1) return vOlvido(head,steps,steps-2);
  const sim={...k, caja:num(V('kb'))+num(V('ka'))+num(V('ke'))}; sim.aportes=k.aportes-(S.cfg.capital||0)+(needCap?num(V('kc')):(S.cfg.capital||0)); sim.segunPlata=k.segunPlata-k.caja+sim.caja-(sim.aportes-k.aportes);
  const diff=sim.segunPlata-sim.neta, ok=cuadra(sim);
  return head+`<h2 style="margin-top:4px">${ok?'¡Cuadra!':diff<0?`Faltan ${clp(-diff)}`:`Sobran ${clp(diff)}`}</h2>
  <div class="sched">${cuadreLines(sim)}</div>
  ${ok?'<div class="okbox" style="margin-top:10px">Todo lo que entró y salió está anotado.</div>':`<div class="warnbox" style="margin-top:10px">${diff<0?'Puede faltar anotar: compras (perfumes en camino), gastos (envíos, cajas, súper) o plata que sacaste para ti.':'Puede faltar anotar: ventas, o plata que pusiste.'}</div>`}
  ${actionbar(`<button class="btn ghost" data-a="cStep" data-v="${steps-1}">Atrás</button><button class="btn" data-a="saveCierre">Guardar cierre</button>`)}`;
}

  const flow=tab.startsWith('f_');
  $('nav.tabs').hidden=flow; $('header.top').hidden=flow||['clientes','cliente','ajustes','revisar'].includes(tab);
  const navTab={cliente:'cobrar',clientes:'cobrar',revisar:'inicio'}[tab]||tab;
  document.querySelectorAll('nav.tabs button[data-to]').forEach(b=>b.dataset.to===navTab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  const nv=byClient(openList()).filter(g=>g.vencN).length, bd=$('#badge'); bd.hidden=!nv; bd.textContent=nv;
  const ae=document.activeElement, fid=ae&&ae.id, sel=ae&&('selectionStart' in ae)?(()=>{try{return ae.selectionStart}catch(e){return null}})():null;
  $('#app').innerHTML=`<div class="screen">${SCREENS[tab]()}</div>`;

    if(s.t==='add') inner=vAddSheet(); else if(s.t==='install') inner=vInstall();
    else if(s.t==='bottle'){ const b=S.bottles.find(x=>x.id===s.id); inner=b?vBottleSheet(b):''; }

    else if(s.t==='hist') inner=vHistSheet(s.k,s.i);

    else if(s.t==='gastoQuick') inner=vGastoQuick(s);

    else if(s.t==='consPremio') inner=(typeof vPremioSheet==='function')?vPremioSheet(s):'';
    if(!inner){ ui.sheet=null; sh.hidden=true; sh.innerHTML=''; } else { sh.innerHTML=`<div class="panel" role="dialog" aria-modal="true">${inner}</div>`; sh.hidden=false; } }
  else { sh.hidden=true; sh.innerHTML=''; }

  if(fid&&!top){ const el=document.getElementById(fid); if(el){ el.focus({preventScroll:true}); if(sel!=null) try{el.setSelectionRange(sel,sel);}catch(e){} } }
  } finally { rendering=false; }
}

function saveSale(){
  const ch=chosenItems(); if(!ch.length) return;
  const items=[]; for(const c of ch) for(let i=0;i<c.qty;i++) items.push(c.dec?{t:'d',ref:c.ref,size:c.size,u:c.u,nombre:c.nombre,lista:c.lista,costo:c.costos[i]}:{t:'b',ref:c.ref,nombre:c.nombre,lista:c.lista,costo:c.costo});
  const L=items.reduce((a,i)=>a+i.lista,0), T0=V('stot')!==''?num(V('stot')):L; if(!T0) return;
  // reparte el total real entre los productos, así la ganancia usa el precio de verdad
  let acc=0; items.forEach((it,i)=>{ it.precio = i===items.length-1 ? T0-acc : (L?Math.round(it.lista*T0/L):Math.round(T0/items.length)); acc+=it.precio; });
  // envío: si lo paga el cliente se suma al total (ingreso y costo iguales); si lo paga Mati, es un gasto
  const entrega=ui.entrega||'mano', envA=entrega==='envio'?num(V('senv')):0, envCli=ui.envPaga==='cliente'?envA:0;
  if(envCli) items.push({t:'x',ref:null,nombre:'Envío (lo paga el cliente)',lista:envCli,precio:envCli,costo:envCli});
  const T=T0+envCli;
  let n=ui.n; const fecha=V('sf',today()), pie0=n>1&&ui.pieOn?Math.min(num(V('spie')),T):0; if(n>1&&pie0>=T) n=1; const pie=n>1?pie0:0, nv=Math.max(S.cfg.nextV||0,...S.ventas.map(v=>+v.id.slice(1)||0),0)+1, id='V'+pad(nv), medio=ui.pMedio, rec=ui.vend;
  let name='';
  commit('', ()=>{
    S.cfg.nextV=nv;
    let k=ui.cliPick&&S.clientes.find(c=>c.id===ui.cliPick);
    if(!k){ k={id:uid('K'),nombre:titleCase(V('ncn',V('sc')).trim()),tel:normTel(V('nct')),dia:num(V('ncd'))||null,notas:'',ult:null,favor:0}; if(k.tel.length<11) k.tel=''; S.clientes.push(k); }
    name=k.nombre;
    for(const it of items) if(it.t==='b'){ const b=S.bottles.find(x=>x.id===it.ref); if(b.estado==='En camino') b.porEntregar=true; b.estado='Vendido'; b.venta=id; b.fSalida=fecha; }
    S.ventas.push({id,cliente:k.id,fecha,vendedor:ui.vend,total:T,pie,items,entrega});
    if(envA&&!envCli) addGasto('Envío',envA,`Envío venta ${id} a ${k.nombre}`,{venta:id}); S.cfg.lastEntrega=entrega;
    if(n===1){ const c={id:uid('C'),venta:id,n:1,monto:T,vence:fecha}; S.cuotas.push(c); S.pagos.push({id:uid('G'),cuota:c.id,fecha,monto:T,tipo:'contado',medio,recibio:rec}); }
    else { if(pie){ const c={id:uid('C'),venta:id,n:0,monto:pie,vence:fecha}; S.cuotas.push(c); S.pagos.push({id:uid('G'),cuota:c.id,fecha,monto:pie,tipo:'pie',medio,recibio:rec}); }
      const ds=schedule(fecha,n,k.dia), ms=split(T-pie,n); ds.forEach((d,i)=>S.cuotas.push({id:uid('C'),venta:id,n:i+1,monto:ms[i],vence:d})); }
  });
  toast(`Venta ${id} guardada: ${clp(T)} a ${name}`,true);
  picks={}; tab='inicio'; ui.sheet={t:'venta',id}; ui.vAct=null; render(true);
}

/* ===================== v5: datos en línea =====================
   Todo el negocio vive en una sola fila de Supabase (tabla pasno_doc, id=1) con un número de versión.
   Cada cambio guarda la fila completa solo si nadie la cambió antes (version = la que tengo).
   Si otra persona guardó primero, recargo y aviso. Sin señal, el cambio queda pendiente y se reintenta. */
const CFG = window.PASNO_CONFIG || {};
const CLOUD = !!(CFG.url && CFG.anonKey && window.supabase);
let sb=null, me=null, docVersion=null, pushing=false, dirty=false, seq=0, syncState='ok', lastSync=null, chan=null;

function cacheLocal(){ try{ localStorage.setItem(KEY, JSON.stringify({S,docVersion,dirty})); }catch(e){} }
function persist(){ seq++; if(CLOUD) dirty=true; cacheLocal(); if(CLOUD) pushDoc(); }
function setSync(s){ syncState=s; const el=document.getElementById('sync'); if(!el) return;
  const m={ok:['Guardado','ok'],saving:['Guardando…','n'],offline:['Sin conexión: se guarda al volver','w'],conflict:['Actualizado por otra persona','n']}[s]||['',''];
  el.textContent=m[0]; el.className='chip '+m[1]; el.hidden=!CLOUD; }
async function pushDoc(){
  if(pushing||!dirty||!sb||docVersion==null) return; pushing=true; setSync('saving');
  try{
    const snapshot=JSON.parse(JSON.stringify(S)), mySeq=seq, next=docVersion+1;
    const {data,error}=await sb.from('pasno_doc').update({data:snapshot,version:next,updated_by:me?me.email:null,updated_at:new Date().toISOString()}).eq('id',1).eq('version',docVersion).select('version');
    if(error) throw error;
    if(!data||!data.length){ // otra persona guardó primero
      await loadDoc(true); undoSnap=null;
      toast('Otra persona guardó un cambio al mismo tiempo. Recargué los datos: revisa y vuelve a anotar lo último.'); }
    else { docVersion=data[0].version; dirty=(seq!==mySeq); lastSync=new Date(); setSync('ok'); }
  }catch(e){ pushing=false; setSync('offline'); clearTimeout(pushDoc.t); pushDoc.t=setTimeout(pushDoc,30000); return; }
  finally{ cacheLocal(); }
  pushing=false; if(dirty) pushDoc();
}
async function loadDoc(force){
  const {data,error}=await sb.from('pasno_doc').select('data,version,updated_by,updated_at').eq('id',1).maybeSingle();
  if(error) throw error;
  if(!data) throw new Error('Falta la fila inicial en pasno_doc');
  if(data.data && (force || !dirty || data.version>docVersion)){ S=data.data; dirty=false; }
  docVersion=data.version; lastSync=new Date(); cacheLocal(); setSync('ok');
  return data;
}
function subscribe(){
  if(chan) return;
  chan=sb.channel('pasno-doc').on('postgres_changes',{event:'UPDATE',schema:'public',table:'pasno_doc',filter:'id=eq.1'},async p=>{
    const v=p.new&&p.new.version; if(v==null||v<=docVersion||pushing) return;
    if(dirty){ return; } // tengo cambios propios por subir: pushDoc resolverá el choque
    await loadDoc(); undoSnap=null; render();
    const who=(p.new.updated_by||'').split('@')[0]; if(me&&p.new.updated_by!==me.email) toast(`Datos actualizados${who?' por '+who:''}`);
  }).subscribe();
}
window.addEventListener('online',()=>{ if(CLOUD&&dirty) pushDoc(); });
document.addEventListener('visibilitychange',()=>{ if(CLOUD&&sb&&me&&document.visibilityState==='visible'&&!dirty) loadDoc().then(()=>render()).catch(()=>setSync('offline')); });

function vImport(msg){
  shell(`<h2>Primera vez</h2><p class="note" style="margin-top:-4px">${msg||'La base de datos está vacía. Carga el archivo de datos de Pasnó (pasno_datos_iniciales.json) que preparó Claude.'}</p>
  <div class="field" style="margin-top:14px"><label for="imp">Archivo de datos (.json)</label><input id="imp" type="file" accept=".json,application/json"></div>
  <p class="note">Esto se hace una sola vez. Después todos ven los mismos datos.</p>`);
  $('#imp').onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ const x=JSON.parse(await f.text()); if(!x||x.v!==4||!Array.isArray(x.bottles)) throw new Error('formato');
      S=x; dirty=true; if(!CLOUD){ cacheLocal(); boot(); return; } await pushDoc(); if(dirty) throw new Error('subir'); boot(); }
    catch(err){ vImport(err.message==='formato'?'Ese archivo no es un respaldo de Pasnó. Elige pasno_datos_iniciales.json.':'No pude subir los datos. Revisa la señal e intenta de nuevo.'); } };
}
async function start(){
  shell('<p class="note" style="margin-top:40px;text-align:center">Cargando…</p>');
  try{
    const {data:{user}}=await sb.auth.getUser(); if(!user){ vLogin(); return; }
    const {data:prof}=await sb.from('pasno_users').select('email,nombre').eq('email',user.email.toLowerCase()).maybeSingle();
    if(!prof){ shell(`<h2>Sin acceso</h2><p class="note">${esc(user.email)} no está autorizado para ver Pasnó. Pídele a Camila que te agregue.</p><button class="btn ghost" id="lo">Salir</button>`); $('#lo').onclick=()=>sb.auth.signOut().then(()=>vLogin()); return; }
    me=prof; if(['Mati','Wanda'].includes(me.nombre)){ ui.vend=me.nombre; ui.pRecibe=me.nombre; }
    const cached=S, d=await loadDoc(); if(!d.data){ S=cached&&cached.v===4&&dirty?cached:null; if(!S){ vImport(); return; } }
    if(dirty) pushDoc();
    subscribe(); render(true);
  }catch(e){
    if(S){ setSync('offline'); render(true); } // sin señal: muestro lo último guardado en el teléfono
    else shell(`<h2>Sin conexión</h2><p class="note">No pude cargar los datos. Revisa la señal y vuelve a abrir la app.</p>`);
  }
}
function boot(){
  const hdr=document.querySelector('header.top .topicons'); if(hdr&&!document.getElementById('sync')){ const s=document.createElement('span'); s.id='sync'; s.className='chip ok'; s.hidden=true; s.style.alignSelf='center'; hdr.prepend(s); }
  try{ const x=JSON.parse(localStorage.getItem(KEY)); if(x&&x.S&&x.S.v===4){ S=x.S; docVersion=x.docVersion??null; dirty=!!x.dirty; } }catch(e){}
  if(!CLOUD){ if(!S){ if(typeof SEED!=='undefined'&&SEED){ S=fresh(); cacheLocal(); } else { vImport('Modo prueba (sin conexión a la base de datos). Carga pasno_datos_iniciales.json para ver la app con datos.'); return; } } render(true); return; }
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'pasno-auth'}});
  start();
}

/* ===================== Consignación: productos que vende otra persona =====================
   Los productos siguen siendo de Pasnó (valen su costo en stock) hasta que el vendedor avisa que los vendió.
   Al vender: se crea la venta a nombre del vendedor y él queda debiendo esa plata (aparece en Cobrar).
   Premio: si el vendedor vende todo lo que se le mandó, se le entrega un perfume que se elige en ese momento (cuenta como costo). */
const vendedores = () => (S.vendedores=S.vendedores||[]);
const consignas = () => (S.consignas=S.consignas||[]);
const vendOf = id => vendedores().find(v=>v.id===id);
const consItems = vid => consignas().filter(g=>g.vendedor===vid).flatMap(g=>g.items.map(i=>({...i,_g:g.id})));
function vendClient(v){ let k=S.clientes.find(c=>c.id===v.cliente); if(!k){ k={id:uid('K'),nombre:v.nombre+' (vendedor)',tel:v.tel||'',dia:null,notas:'Vende por consignación',ult:null,favor:0}; S.clientes.push(k); v.cliente=k.id; } return k; }

function vConsigna(){
  const vs=vendedores();
  if(!vs.length) return `<div class="card" style="margin-top:12px"><span class="t">Nadie vendiendo por ti todavía</span><span class="s">Cuando le pases decants o perfumes a alguien para que los venda, anótalo con el botón + → Mandé a vender.</span></div>`;
  return vs.map(v=>{ const its=consItems(v.id), fuera=its.filter(i=>i.estado==='fuera'), vend=its.filter(i=>i.estado==='vendido'), total=its.filter(i=>i.estado!=='devuelto');
    const todo=total.length&&!fuera.length, k=S.clientes.find(c=>c.id===v.cliente), deb=k?debtOf(k.id):0;
    return `<div class="card" style="margin-top:12px">
      <div class="row" style="padding:0;border:0"><div class="main"><div class="t">${esc(v.nombre)}</div><div class="s">${fuera.length} producto${fuera.length===1?'':'s'} en su poder · se venden en ${clp(fuera.reduce((a,i)=>a+i.precio,0))}</div></div>${deb?`<span class="chip n">te debe ${clp(deb)}</span>`:''}</div>
      ${v.premio?`<div><div class="prog"><span style="width:${total.length?vend.length/total.length*100:0}%;background:var(--good)"></span></div><span class="s">Premio si vende todo: ${esc(v.premio.desc)} · ${vend.length} de ${total.length} vendidos${v.premio.entregado?' · <b>entregado</b>':''}</span></div>`:''}
      <div class="list">${fuera.map(i=>`<div class="row"><div class="main"><div class="t">${esc(i.nombre)}</div><div class="s">mandado el ${fmtDate(consignas().find(g=>g.id===i._g).fecha)}</div></div><span class="amt">${clp(i.precio)}</span></div>`).join('')||'<div class="empty">No tiene productos tuyos ahora.</div>'}</div>
      <div class="acts">${fuera.length?`<button class="btn paid" data-a="consVend" data-id="${v.id}">Vendió…</button><button class="btn ghost" data-a="consDev" data-id="${v.id}">Me devolvió…</button>`:''}<button class="btn ghost" data-a="flow" data-f="f_consigna" data-id="${v.id}">Mandar más</button>${deb&&k?`<button class="btn ghost" data-a="openCli" data-id="${k.id}">Cobrarle</button>`:''}</div>
      ${v.premio&&todo&&!v.premio.entregado?`<div class="okbox">¡Vendió todo! Le toca su premio: ${esc(v.premio.desc)}. <button class="linkbtn" data-a="consPremio" data-id="${v.id}">Entregar premio</button></div>`:''}
      ${vend.length?`<p class="note" style="margin:0">Vendidos: ${vend.length} por ${clp(vend.reduce((a,i)=>a+(i.vendidoEn||i.precio),0))}. Lo que te debe aparece en Cobrar.</p>`:''}
    </div>`; }).join('');
}

/* ===================== Recordar costos =====================
   La app pregunta por el costo en el mismo momento en que se anota algo que suele tenerlo
   (envío al vender o mandar a vender, flete al recibir un pedido, frascos al abrir para decants),
   sugiere montos según lo que Mati ha pagado antes, y al cerrar el mes revisa qué pudo quedar sin anotar. */
const COST_DEF={'Envío':[3900,5100,6350],'Frascos decant':[5000,10000,20000]};
function sugAmounts(cat){
  // solo gastos con fecha: los totales sueltos del Excel no son un envío real
  const g=S.gastos.filter(x=>x.cat===cat&&x.fecha&&x.monto>0&&x.monto<100000).slice(-30), f=new Map();
  g.forEach((x,i)=>f.set(x.monto,(f.get(x.monto)||0)+1+i/1000));
  const top=[...f.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  for(const d of COST_DEF[cat]||[]) if(top.length<3&&!top.includes(d)) top.push(d);
  return top.slice(0,3).sort((a,b)=>a-b);
}
// botones con montos sugeridos + "No pagué" + otro monto
function costChips(fid,cat,noLabel='No pagué'){
  const cur=V(fid), sug=sugAmounts(cat), isSug=sug.includes(num(cur));
  return `<div class="chips">${sug.map(a=>`<div class="seg"><button data-a="chip" data-f="${fid}" data-v="${a}" ${pressed(cur!==''&&num(cur)===a)}>${clp(a)}</button></div>`).join('')}<div class="seg"><button data-a="chip" data-f="${fid}" data-v="0" ${pressed(cur==='0')}>${noLabel}</button></div></div>
  <input id="${fid}" data-k data-r inputmode="numeric" placeholder="Otro monto" style="margin-top:6px" value="${esc(cur!==''&&cur!=='0'&&!isSug?num(cur).toLocaleString('es-CL'):'')}">`;
}

/* cierre de mes: ¿olvidaste algo? */
function olvidos(){
  const K=S.saldos[S.saldos.length-1], desde=K?K.fecha:today().slice(0,7)+'-01', out=[];
  for(const g of (S.consignas||[])) if(g.fecha>=desde&&g.envio==null){ const v=(S.vendedores||[]).find(x=>x.id===g.vendedor); out.push({t:`Mandaste productos a ${v?v.nombre:'un vendedor'} el ${fmtDate(g.fecha)}`,cat:'Envío',det:`Envío a ${v?v.nombre:'vendedor'}`,ref:{consigna:g.id}}); }
  for(const c of S.compras) if(c.estado==='Recibida'&&c.fecha>=desde&&c.flete==null){ const p=S.proveedores.find(x=>x.id===c.prov); out.push({t:`Recibiste el pedido de ${p?p.nombre:'un proveedor'} (${fmtDate(c.fecha)})`,cat:'Envío',det:`Flete pedido ${p?p.nombre:''}`.trim(),ref:{compra:c.id}}); }
  const ab=S.bottles.filter(b=>b.dec&&b.dec.abierta>=desde).length, fr=S.gastos.filter(g=>g.cat==='Frascos decant'&&(g.fecha||'')>=desde).length;
  if(ab&&!fr) out.push({t:`Abriste ${ab} botella${ab>1?'s':''} para decants y no hay frascos anotados`,cat:'Frascos decant',det:'Frascos y atomizadores'});
  const env=S.ventas.filter(v=>(v.fecha||'')>=desde&&v.entrega==='envio').length, envG=S.gastos.filter(g=>g.cat==='Envío'&&(g.fecha||'')>=desde).length;
  if(env>envG) out.push({t:`Hiciste ${env} venta${env>1?'s':''} con envío y hay ${envG} envío${envG===1?'':'s'} anotado${envG===1?'':'s'}`,cat:'Envío',det:'Envío de una venta'});
  return out;
}
function vOlvido(head,next,prev){

const IA_EJEMPLOS=['vendí un light blue a la tía ana en 3 cuotas','la caro me pagó 40 lucas','pagué 6 lucas de envío a santiago','pasé 50 lucas al ahorro'];

  ${r.error?`<div class="warnbox" style="margin-top:12px">${esc(r.error)}</div>`:''}
  ${(r.preguntas||[]).length?`<div class="warnbox" style="margin-top:12px">${r.preguntas.map(esc).join('<br>')}<br><span class="s">Corrige el texto y vuelve a interpretar, o ajústalo en el formulario.</span></div>`:''}
  ${(r.acciones||[]).length?`<h3>Te propongo anotar</h3><div class="list">${r.acciones.map((a,i)=>`<div class="row"><div class="main"><div class="t" style="white-space:normal">${esc(a.resumen)}</div><div class="s">${{venta:'Venta',pago:'Pago',gasto:'Gasto',movimiento:'Movimiento'}[a.tipo]}${a._aviso&&!a._hecho?' · <span class="chip w">'+esc(a._aviso)+'</span>':''}</div></div>${a._hecho?'<span class="chip ok">✓ anotado</span>':iaFalta(a)?'<span class="s">Elige abajo ↓</span>':`<button class="btn sm" data-a="iaAbrir" data-i="${i}">Revisar</button>`}</div>${iaOpciones(a,i)}`).join('')}</div>
    <p class="note">Cada una abre el formulario de siempre con los datos listos. Revisa y toca Guardar.</p>`:''}`;
}

const iaFalta=a=>(a.cliente_opciones||[]).length&&!a.cliente_id&&!a._otra&&!a._esNuevo;
function iaOpciones(a,i){ const op=a.cliente_opciones||[]; if(a._hecho||!op.length||a._otra) return '';

// valida la propuesta contra los datos reales antes de mostrarla
function iaCheck(a){
  if(a.cliente_id&&!S.clientes.some(k=>k.id===a.cliente_id)){ a.cliente_id=null; a._aviso='revisa el cliente'; }
  a.cliente_opciones=[...new Set(a.cliente_opciones||[])].filter(id=>S.clientes.some(k=>k.id===id)).slice(0,6);
  if(a.cliente_id) a.cliente_opciones=[];
  if(a.tipo!=='venta'&&!a.cliente_opciones.length) a.cliente_nuevo=a.cliente_id?null:a.cliente_nuevo;
  a.productos=(a.productos||[]).filter(p=>{ const b=S.bottles.find(x=>x.id===p.ref); return b&&(b.estado==='Stock'||b.estado==='En camino'||b.estado==='Abierta'); });
  if(a.tipo==='venta'&&!a.productos.length) a._aviso='elige los perfumes';
  if(a.tipo==='pago'&&!a.cliente_id) a._aviso='elige quién pagó';
  if(a.cliente_opciones.length&&!a.cliente_id) a._aviso='¿cuál cliente?';
  return a;
}
Object.assign(A,{
  iaClose(){ if(ui.iaMic) ui.iaMic.stop(); if(ui.ia&&ui.ia.acciones&&ui.ia.acciones.every(a=>a._hecho)) ui.ia.done=true; tab=ui.iaFrom||'inicio'; render(true); },
  iaEj(d){ FORM.iat=d.v; render(); },
  iaMic(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
    if(ui.iaMic){ ui.iaMic._enviar=true; ui.iaMic.stop(); return; }
    const rec=new SR(); rec.lang='es-CL'; rec.interimResults=true; rec.continuous=true; const base=V('iat'); let fin='';
    rec.onresult=e=>{ let tmp=''; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=t+' '; else tmp+=t; } FORM.iat=(base?base+' ':'')+fin+tmp; const el=$('#iat'); if(el) el.value=FORM.iat; };
    rec.onend=()=>{ const enviar=rec._enviar; ui.iaMic=null; if(enviar&&V('iat').trim()) A.iaGo(); else render(); }; rec.onerror=()=>{ ui.iaMic=null; render(); };
    ui.iaMic=rec; rec.start(); render(); },
  async iaGo(){ const texto=V('iat').trim(); if(!texto){ toast('Escribe o di qué quieres anotar'); return; }
    if(ui.iaMic) ui.iaMic.stop();
    if(!CLOUD||!sb){ ui.ia={error:'La IA funciona solo con la app conectada (no en modo prueba).'}; render(); return; }
    if(!navigator.onLine){ ui.ia={error:'Sin conexión: usa los formularios normales.'}; render(); return; }
    ui.ia={estado:'pensando'}; render();
    try{ const {data,error}=await sb.functions.invoke('pasno-ia',{body:{texto,hoy:today()}});
      if(error){ let msg='No pude conectarme con la IA. Intenta de nuevo.'; try{ const b=await error.context.json(); if(b&&b.error) msg=b.error; }catch(e){} ui.ia={error:msg}; }
      else ui.ia={texto,log:data.log_id||null,acciones:(data.acciones||[]).map(iaCheck),preguntas:data.preguntas||[]};
    }catch(e){ ui.ia={error:'No pude conectarme con la IA. Intenta de nuevo.'}; }
    if(ui.ia.acciones&&!ui.ia.acciones.length&&!(ui.ia.preguntas||[]).length) ui.ia.error='No encontré nada para anotar. Prueba contándolo de otra forma.';
    render(); },
  iaAbrir(d){ const a=ui.ia.acciones[+d.i]; if(!a||a._hecho) return; ui.iaCur=+d.i;

function iaDone(rec){ if(ui.iaCur==null||!ui.ia||!ui.ia.acciones) return; const a=ui.ia.acciones[ui.iaCur];

  // si se toca "Deshacer", la propuesta vuelve a quedar pendiente
  const ub=$('#undoBtn'), ia=ui.ia; if(ub&&ub.onclick){ const orig=ub.onclick; ub.onclick=()=>{ orig(); a._hecho=false; ia.done=false; if(tab==='f_ia') render(); }; }
  tab='f_ia'; if(!rec||rec.tipo!=='ventas') ui.sheet=null; render(true); }

for(const k in IA_SAVES){ const f=A[k], arr=IA_SAVES[k]; A[k]=function(...args){ const before=S[arr].length; const r=f.apply(this,args); if(S[arr].length>before) iaDone({tipo:arr,nuevos:S[arr].slice(before)}); return r; }; }

/* ---------- La IA aprende de las correcciones ----------
   Si la propuesta decía una cosa y se guardó otra (otro cliente, otro perfume, otra categoría, otro monto),
   se anota aquí. La próxima vez la función se lo muestra a la IA. Se comparte entre Mati, Wanda y Camila. */
const iaMem=()=>S.iaMem||(S.iaMem={alias:[],notas:[]});
const sinArticulo=s=>norm(s).replace(/^(a |al |de |del )?(la |el |los |las |mi |don |dona )?/,'').trim();
function iaLearn(a,rec,texto){
  if(!rec||!rec.nuevos.length) return;
  const M=iaMem(), r=rec.nuevos[0], f=today(), cit=texto.length>120?texto.slice(0,117)+'…':texto, notas=[];
  // ¿a quién se le anotó de verdad?
  let cli=null;
  if(rec.tipo==='ventas') cli=r.cliente;
  if(rec.tipo==='pagos'){ const c=S.cuotas.find(x=>x.id===r.cuota), v=c&&S.ventas.find(x=>x.id===c.venta); cli=v?v.cliente:null; }
  if(cli&&a.cliente_dicho&&(cli!==a.cliente_id||a._elegido)){ const d=sinArticulo(a.cliente_dicho);
    if(d){ M.alias=M.alias.filter(x=>x.d!==d); M.alias.push({d,id:cli,f}); if(M.alias.length>150) M.alias.shift(); } }
  if(rec.tipo==='ventas'){
    const prop=(a.productos||[]).map(p=>{ const b=S.bottles.find(x=>x.id===p.ref); return b?b.name:null; }).filter(Boolean).sort();
    const real=[...new Set(r.items.filter(i=>i.t!=='x').map(i=>i.nombre))].sort();
    if(prop.length&&[...new Set(prop)].join('|')!==real.join('|')) notas.push(`En "${cit}" el perfume era ${real.join(', ')}, no ${[...new Set(prop)].join(', ')}.`);
    const tot=r.total-r.items.filter(i=>i.t==='x').reduce((s,i)=>s+i.precio,0);
    if(a.total&&a.total!==tot) notas.push(`En "${cit}" el total era ${tot}, no ${a.total}.`);
  }
  if(rec.tipo==='pagos'){ const m=rec.nuevos.reduce((s,x)=>s+x.monto,0); if(a.monto&&a.monto!==m) notas.push(`En "${cit}" el monto era ${m}, no ${a.monto}.`); }
  if(rec.tipo==='gastos'){ if(a.gasto_categoria&&a.gasto_categoria!==r.cat) notas.push(`En "${cit}" el gasto era de categoría ${r.cat}, no ${a.gasto_categoria}.`);
    if(a.monto&&a.monto!==r.monto) notas.push(`En "${cit}" el monto era ${r.monto}, no ${a.monto}.`); }
  if(rec.tipo==='movs'){ if(a.mov_tipo&&a.mov_tipo!==r.tipo) notas.push(`En "${cit}" el movimiento era ${r.tipo}, no ${a.mov_tipo}.`);
    if(a.monto&&a.monto!==r.monto) notas.push(`En "${cit}" el monto era ${r.monto}, no ${a.monto}.`); }
  // historial: lo que se dijo, lo que propuso la IA (queda en el registro de la función) y lo que se guardó de verdad
  const H=S.iaHist||(S.iaHist=[]), fin={tipo:rec.tipo};
  if(rec.tipo==='ventas'){ Object.assign(fin,{cliente:r.cliente,productos:r.items.filter(i=>i.t!=='x').map(i=>i.t==='d'?i.ref+'|'+i.size:i.ref),total:r.total,cuotas:S.cuotas.filter(c=>c.venta===r.id&&c.n>0).length,pie:r.pie||0,entrega:r.entrega||null}); }
  else if(rec.tipo==='pagos') Object.assign(fin,{cliente:cli,monto:rec.nuevos.reduce((s,x)=>s+x.monto,0),medio:r.medio||null});
  else if(rec.tipo==='gastos') Object.assign(fin,{cat:r.cat,monto:r.monto});
  else Object.assign(fin,{mov:r.tipo,monto:r.monto});
  H.push({log:ui.ia&&ui.ia.log,f,texto:cit,n:ui.iaCur,fin}); if(H.length>500) H.splice(0,H.length-500);
  for(const txt of notas){ M.notas.push({txt,f}); } if(M.notas.length>40) M.notas.splice(0,M.notas.length-40);
  save();
}

/* ---------- Prueba de la IA: 30 frases a la manera de Mati ---------- */
// las frases de prueba usan nombres reales de clientes: viven en los datos privados (S.iaTest), no en este código público
const iaTests=()=>S.iaTest||[];
function iaGrade(exp,res){
  const acc=res.acciones||[], errs=[];
  if(exp.length===1&&exp[0].preg){ const okP=(res.preguntas||[]).length>0&&!acc.some(a=>a.tipo==='venta'&&(a.productos||[]).length); return okP?[]:['debía preguntar porque ese perfume no está en stock']; }
  if(!exp.length) return acc.length?['no debía anotar nada']:[];
  if(acc.length<exp.length) return [`propuso ${acc.length} registro(s), se esperaban ${exp.length}`];
  exp.forEach((e,i)=>{ const a=acc[i]; if(a.tipo!==e.tipo){ errs.push(`tipo ${a.tipo} ≠ ${e.tipo}`); return; }
    if(e.cli){ const k=S.clientes.find(c=>c.id===a.cliente_id); if(!k||norm(k.nombre)!==norm(e.cli)) errs.push(`cliente ${k?k.nombre:'—'} ≠ ${e.cli}`); }
    if(e.nuevo&&!a.cliente_nuevo) errs.push('no detectó cliente nuevo');
    for(const [f,ef] of [['cuotas','cuotas'],['total','total'],['monto','monto'],['pie','pie']]) if(e[ef]!=null&&a[f]!==e[ef]) errs.push(`${f} ${a[f]} ≠ ${e[ef]}`);
    if(e.cat&&a.gasto_categoria!==e.cat) errs.push(`categoría ${a.gasto_categoria} ≠ ${e.cat}`);
    if(e.mov&&a.mov_tipo!==e.mov) errs.push(`tipo ${a.mov_tipo} ≠ ${e.mov}`);
    if(e.env&&a.envio_monto!==e.env) errs.push(`envío ${a.envio_monto} ≠ ${e.env}`);
  });
  return errs;
}

const IAT_KEY='pasno-iatest';

const IA_MODELOS={auto:['Automático',0,0],'claude-opus-5-5':['Opus 5.5',4,20],'claude-sonnet-5-5':['Sonnet 5.5',2,10],'claude-haiku-5-5':['Haiku 5.5',0.1,0.5]};
function iatLoad(){ if(ui.iaTest) return ui.iaTest; try{ const r=JSON.parse(localStorage.getItem(IAT_KEY)||'null'); if(r&&Array.isArray(r.res)) return ui.iaTest={running:false,res:r.res,modelo:r.modelo||'auto'}; }catch(e){} return ui.iaTest={running:false,res:[],modelo:'auto'}; }
function iatSave(){ try{ localStorage.setItem(IAT_KEY,JSON.stringify({res:ui.iaTest.res,modelo:ui.iaTest.modelo})); }catch(e){} }
function vIATest(){
  const T=iatLoad(), N=iaTests().length;
  const done=T.res.length, ok=T.res.filter(r=>!r.errs.length).length, tin=T.res.reduce((a,r)=>a+(r.u?r.u.input_tokens:0),0), tout=T.res.reduce((a,r)=>a+(r.u?r.u.output_tokens:0),0);
  const [mNom,pin,pout]=IA_MODELOS[T.modelo]||IA_MODELOS.auto, usd=T.res.reduce((a,r)=>a+(r.out&&r.out.costo_usd!=null?r.out.costo_usd:(r.u?r.u.input_tokens/1e6*pin+r.u.output_tokens/1e6*pout:0)),0), esc_=T.res.filter(r=>r.out&&r.out.escalado).length;
  const elegir=T.running?'':`<div class="field"><span class="lab">Modelo para ${done&&done<N?'empezar de nuevo':'la prueba'}</span>${segBtns('iaTestModelo',Object.entries(IA_MODELOS).map(([k,v])=>[k,v[0]]),ui.iaTestM||T.modelo)}</div>`;
  const btns=T.running?'':!done?`<button class="btn block" data-a="iaTestRun">Empezar la prueba</button>`
    :`<div class="acts">${done<N&&(ui.iaTestM||T.modelo)===T.modelo?`<button class="btn" data-a="iaTestRun">Continuar (${done} de ${N})</button>`:''}<button class="btn ghost" data-a="iaTestRun" data-v="nueva">Empezar de nuevo</button></div>`;
  return `<div class="topbar"><button class="back" data-a="go" data-to="ajustes" aria-label="Volver">←</button><h2>Probar la IA</h2></div>
  <p class="note" style="margin-top:0">Manda ${N} frases escritas como las diría Mati y revisa si la IA propone lo correcto. No guarda nada. Usa la IA ${N} veces (Automático es lo que usa la app: Haiku y, si no tiene sentido, Opus) y no cuenta para el límite diario de uso normal.</p>
  ${elegir}
  ${T.error?`<div class="warnbox" style="margin-top:12px">Se detuvo: ${esc(T.error)}</div>`:''}
  ${btns}
  ${done?`<div class="card" style="margin-top:12px"><span class="lab">${mNom} · Resultado${T.running?' (en curso)':done<N?' (a medias)':''}</span><span style="font-size:22px;font-weight:700">${ok} de ${done} correctas</span><span class="s">${tin.toLocaleString('es-CL')} tokens de entrada · ${tout.toLocaleString('es-CL')} de salida · costo aprox. USD ${usd.toFixed(3)}${T.modelo==='auto'?` · ${esc_} de ${done} pasaron a Opus`:''}</span></div>
  <div class="list" style="margin-top:12px">${T.res.map(r=>`<div class="row"><div class="main"><div class="t" style="white-space:normal">${r.errs.length?'✗':'✓'} ${esc(r.t)}</div><div class="s" style="white-space:normal">${r.out&&r.out.escalado?'[Opus: '+esc(r.out.escalado)+'] ':''}${r.errs.length?esc(r.errs.join(' · ')):esc((r.out.acciones||[]).map(a=>a.resumen).join(' / ')||(r.out.preguntas||[]).join(' ')||'sin registros')}</div></div></div>`).join('')}</div>`:''}
  ${T.running?'<p class="note">Probando… si cierras la pantalla, al volver puedes continuar donde quedó.</p>':''}`;
}

A.iaTestRun=async(d)=>{ if(!CLOUD||!sb){ toast('La prueba funciona solo con la app conectada'); return; }
  const T=iatLoad(); if(T.running) return;
  const m=ui.iaTestM||T.modelo; if(d&&d.v==='nueva'||m!==T.modelo){ T.res=[]; T.modelo=m; }
  T.running=true; T.error=null; iatSave(); render();
  const L=iaTests();
  for(let i=T.res.length;i<L.length;i++){ const [t,exp]=L[i];
    let out={}, u=null;
    try{ const {data,error}=await sb.functions.invoke('pasno-ia',{body:{texto:t,hoy:today(),prueba:true,...(T.modelo==='auto'?{}:{modelo:T.modelo})}}); if(error){ let m='error'; try{ m=(await error.context.json()).error; }catch(e){} out={error:m}; } else { out=data; u=data.usage; } }catch(e){ out={error:'sin conexión'}; }
    // si falla la conexión o el límite, se detiene sin contar esa frase, para retomarla después
    if(out.error){ T.error=out.error; break; }
    T.res.push({t,out,errs:iaGrade(exp,out),u}); iatSave(); if(tab==='iatest') render();
  }
  T.running=false; if(tab==='iatest') render(); };
